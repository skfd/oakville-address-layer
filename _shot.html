<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #222; overflow: hidden; }
  #map { width: 100vw; height: 100vh; }
  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
function qs(k, d) {
  var v = new URLSearchParams(location.search).get(k);
  return v === null ? d : v;
}
var lat = parseFloat(qs("lat", 43.44647));
var lon = parseFloat(qs("lon", -79.75885));
var z = parseInt(qs("z", 19), 10);
var base = qs("base", "esri");
var raster = qs("raster",
  "https://skfd.github.io/oakville-address-layer/tiles/raster/{z}/{x}/{y}.png");

var map = L.map("map", {
  zoomControl: false, attributionControl: true,
  minZoom: 10, maxZoom: 21
}).setView([lat, lon], z);

if (base === "esri") {
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxNativeZoom: 19, maxZoom: 21, attribution: "Imagery &copy; Esri" }
  ).addTo(map);
} else {
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxNativeZoom: 19, maxZoom: 21, attribution: "&copy; OpenStreetMap" }
  ).addTo(map);
}

var addr = L.tileLayer(raster, {
  minZoom: 16, maxNativeZoom: parseInt(qs("native", 21), 10), maxZoom: 21,
  attribution: "&copy; Town of Oakville"
}).addTo(map);

window.__tilesPending = 1;
addr.on("loading", function () { window.__tilesPending = 1; });
addr.on("load", function () { window.__tilesPending = 0; });
</script>
</body>
</html>
